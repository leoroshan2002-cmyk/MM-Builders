document.querySelectorAll('[data-l]').forEach(c=>c.onchange=()=>layers[c.dataset.l].visible=c.checked);
tx.onchange=()=>lab.style.display=tx.checked?'':'none';
let q='';document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();LB.forEach(o=>{const h=q&&o.t.includes(q);o.d.classList.toggle('hit',!!h);o.r.style.display=!q||h?'':'none';});};
let wire=true;wf.onclick=()=>{wire=!wire;wf.textContent='Mode: '+(wire?'Wireframe':'Dim');mats.forEach(([m,o])=>m.opacity=wire?o:o*.5);fm.opacity=wire?.07:.2;};
src.onclick=()=>ov.style.display='block';lst.onclick=()=>list.style.display=list.style.display=='block'?'none':'block';
function rz(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',rz);rz();view('front');
let t0=performance.now();const intro=document.getElementById('intro');
setTimeout(()=>{intro.style.opacity=0;setTimeout(()=>intro.remove(),1300);t0=performance.now();},1200);
const a=new THREE.Vector3(),b=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);
 const e=Math.min(1,(performance.now()-t0)/3500),s=1-Math.pow(1-e,3);boxes.forEach(g=>{g.scale.z=Math.max(.001,g.userData.d*s);g.position.z=g.scale.z/2;});
 if(ov.style.display!='block'){ctl.update();R.render(sc,cam);
 if(tx.checked)LB.forEach(o=>{a.copy(o.v).project(cam);let ok=a.z<1&&Math.abs(a.x)<1.05&&Math.abs(a.y)<1.05;let fs=0;
  if(ok){b.copy(o.e).project(cam);fs=Math.hypot((b.x-a.x)*innerWidth/2,(b.y-a.y)*innerHeight/2)*1.15;ok=fs>=3.5&&fs<80;}
  o.d.style.display=ok?'':'none';
  if(ok){o.d.style.fontSize=fs+'px';o.d.style.transform=`translate(${(a.x*.5+.5)*innerWidth}px,${(-a.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`+(o.up?'':' rotate(-90deg)');}});}
})();
